<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2a43"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Bilanz"><title>Vermögensbilanz</title>
<style>
:root{--bg:#f3f5f8;--c:#fff;--t:#14202e;--m:#6b7785;--p:#0f2a43;--g:#1a9b6c;--r:#c8453b;--o:#e0a030}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t);padding-bottom:84px}
header{background:var(--p);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px}.seg{display:flex;gap:6px;margin-top:8px}
.seg button{flex:1;padding:7px;border:0;border-radius:16px;background:#ffffff22;color:#fff;font-size:13px}
.seg button.on{background:#fff;color:var(--p);font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:9px 4px;border:0;border-radius:10px;background:#e8ebf0;color:var(--p);font-size:13px}.tabs button.on{background:var(--p);color:#fff}
main{padding:12px}.card{background:var(--c);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
.big{font-size:32px;font-weight:700}.sub{color:var(--m);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.k{background:var(--c);border-radius:12px;padding:12px;box-shadow:0 1px 3px #0001}
.k b{display:block;font-size:20px;margin-top:4px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #eef0f3;gap:8px}
.row:last-child{border:0}.row small{color:var(--m);display:block}.neg{color:var(--r)}.pos{color:var(--g)}
.row.tot{border-top:2px solid var(--p);border-bottom:0;font-weight:700;margin-top:2px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #e2e6eb;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:12px 2px;font-size:11px;color:var(--m)}nav button.on{color:var(--p);font-weight:700}
label{display:block;font-size:12px;color:var(--m);margin:10px 0 3px}input,select,textarea{width:100%;padding:11px;border:1px solid #d5dae1;border-radius:10px;font-size:16px;background:#fff}
input[type=checkbox]{width:auto}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--p);color:#fff;font-size:16px;margin-top:14px}.btn.s{background:#e8ebf0;color:var(--p)}.btn.d{background:#fbe9e7;color:var(--r)}.btn:disabled{opacity:.5}
h3{margin:4px 0 8px;font-size:15px}.bar{height:8px;border-radius:4px;background:#e8ebf0;overflow:hidden}.bar i{display:block;height:100%}
.warn{font-size:12px;padding:3px 8px;border-radius:10px;background:#fdf3dc;color:#8a5d00}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--m);font-weight:500;text-align:right;padding:6px 2px}td{text-align:right;padding:8px 2px;border-top:1px solid #eef0f3}th:first-child,td:first-child{text-align:left}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#lock{display:none;min-height:100vh;background:var(--p);padding-top:8vh}
body.locked{padding-bottom:0;background:var(--p)}body.locked #lock{display:block}body.locked header,body.locked main,body.locked nav{display:none}
body.priv header,body.priv main,body.priv nav{visibility:hidden}
.err{color:var(--r);font-size:13px;margin-top:8px}
</style></head><body>
<header><h1>Vermögensbilanz</h1><div class="seg" id="own"></div></header>
<main id="v"></main>
<nav id="nav"></nav>
<div id="lock"></div>
<script>
/* ---------- Sicherer Speicher ---------- */
const enc=new TextEncoder(),dec=new TextDecoder();
const b2s=u=>{const a=new Uint8Array(u);let s='';for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)};
const s2b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const DBO=()=>new Promise((res,rej)=>{const r=indexedDB.open('vb',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbGet=async k=>{const d=await DBO();return new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const idbPut=async o=>{const d=await DBO();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite'),st=t.objectStore('kv');for(const k in o)st.put(o[k],k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})};
async function derive(pw,salt,iter){const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encJ(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(obj)));return{iv:b2s(iv),ct:b2s(ct)}}
async function decJ(key,o){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:s2b(o.iv)},key,s2b(o.ct));return JSON.parse(dec.decode(pt))}
const ITER=600000;
let S=null,KEY=null,META=null,Q=Promise.resolve(),fails=0,until=0,hiddenAt=0;
const save=()=>{if(!KEY)return;const snap=JSON.parse(JSON.stringify(S));Q=Q.then(async()=>{await idbPut({data:await encJ(KEY,snap)})}).catch(()=>alert('Speichern fehlgeschlagen!'))};
function lockUI(msg){document.body.classList.add('locked');const setup=!META,legacy=!!localStorage.getItem('vb');
document.getElementById('lock').innerHTML=`<div class="card" style="margin:0 14px"><h3>${setup?'Passwort festlegen':'Entsperren'}</h3>
<div class="sub">${setup?'Deine Daten werden mit diesem Passwort verschlüsselt (AES-256) auf diesem Gerät gespeichert.'+(legacy?' Vorhandene Daten werden übernommen.':''):'Bitte Passwort eingeben.'}</div>
<label>Passwort${setup?' (mind. 8 Zeichen, besser ein Satz)':''}</label><input id="pw" type="password" autocomplete="${setup?'new-password':'current-password'}" onkeydown="if(event.key=='Enter')go()">
${setup?`<label>Wiederholen</label><input id="pw2" type="password" autocomplete="new-password" onkeydown="if(event.key=='Enter')go()">
<label style="display:flex;gap:8px;align-items:flex-start;color:var(--t)"><input type="checkbox" id="ok"> Ich weiß: Ohne Passwort sind die Daten nicht wiederherstellbar. Ich führe Backups.</label>`:''}
<button class="btn" id="gb" onclick="go()">${setup?'Speichern & starten':'Entsperren'}</button>
${msg?`<div class="err">${msg}</div>`:''}
${setup?'':`<button class="btn d" onclick="wipe()">Passwort vergessen – alle Daten löschen</button>`}</div>`}
async function go(){const pw=document.getElementById('pw').value;const b=document.getElementById('gb');
if(!META){const p2=document.getElementById('pw2').value;if(pw.length<8)return lockUI('Mindestens 8 Zeichen.');if(pw!==p2)return lockUI('Passwörter stimmen nicht überein.');
if(!document.getElementById('ok').checked)return lockUI('Bitte Hinweis bestätigen.');
b.disabled=true;b.textContent='Bitte warten …';
try{let d=null;try{d=JSON.parse(localStorage.getItem('vb')||'null')}catch(e){}
if(!d||!d.pos)d={v:1,pos:[],hist:[]};
const salt=crypto.getRandomValues(new Uint8Array(16));const key=await derive(pw,salt,ITER);
const m={salt:b2s(salt),iter:ITER};await idbPut({meta:m,data:await encJ(key,d)});
localStorage.removeItem('vb');META=m;KEY=key;S=d;startApp()}catch(e){lockUI('Fehler: '+e.message)}return}
if(Date.now()<until)return lockUI('Bitte '+Math.ceil((until-Date.now())/1000)+' s warten.');
b.disabled=true;b.textContent='Prüfe …';
try{const key=await derive(pw,s2b(META.salt),META.iter);const d=await decJ(key,await idbGet('data'));KEY=key;S=d;fails=0;startApp()}
catch(e){fails++;until=Date.now()+Math.min(30,Math.pow(2,fails))*1000;lockUI('Passwort falsch.')}}
function startApp(){if(!S.ann)S.ann=defAnn();document.getElementById('lock').innerHTML='';document.body.classList.remove('locked','priv');tab='home';own='Alle';cred=null;edit=null;draw()}
function lockNow(){S=null;KEY=null;lockUI('')}
function wipe(){if(confirm('ALLE gespeicherten Daten unwiderruflich löschen?')){indexedDB.deleteDatabase('vb');localStorage.removeItem('vb');setTimeout(()=>location.reload(),300)}}
document.addEventListener('visibilitychange',()=>{if(!KEY)return;if(document.hidden){hiddenAt=Date.now();document.body.classList.add('priv')}else{document.body.classList.remove('priv');if(Date.now()-hiddenAt>60000)lockNow()}});
async function chpw(){const a=document.getElementById('np').value,b=document.getElementById('np2').value;
if(a.length<8)return alert('Mindestens 8 Zeichen.');if(a!==b)return alert('Passwörter stimmen nicht überein.');
const salt=crypto.getRandomValues(new Uint8Array(16)),key=await derive(a,salt,ITER),m={salt:b2s(salt),iter:ITER};
await idbPut({meta:m,data:await encJ(key,S)});META=m;KEY=key;alert('Passwort geändert.');draw()}
async function ex(plain){let blob,name;
if(plain){if(!confirm('Unverschlüsseltes Backup enthält alle Beträge im Klartext. Fortfahren?'))return;blob=JSON.stringify(S,null,1);name='vermoegensbilanz_KLARTEXT.json'}
else{blob=JSON.stringify({enc:1,salt:META.salt,iter:META.iter,...await encJ(KEY,S)});name='vermoegensbilanz_backup_verschluesselt.json'}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([blob],{type:'application/json'}));a.download=name;a.click()}
function im(e){const r=new FileReader();r.onload=async()=>{try{let d=JSON.parse(r.result);
if(d.enc){const pw=prompt('Passwort dieses Backups:');if(!pw)return;d=await decJ(await derive(pw,s2b(d.salt),d.iter),d)}
if(!d.pos)throw 0;if(!confirm('Aktuelle Daten durch das Backup ersetzen?'))return;S=d;if(!S.ann)S.ann=defAnn();save();tab='home';draw()}catch(x){alert('Datei ungültig oder Passwort falsch')}};r.readAsText(e.target.files[0]);e.target.value=''}
/* ---------- Fachlogik ---------- */
const KL=['Immobilien','Aktien','ETFs','Anleihen','Lebensversicherung','Gold','Tagesgeld','Bargeld','Krypto','Hypothek','Sonstiges'];
const COL={Immobilien:'#0f2a43',Aktien:'#1a9b6c',ETFs:'#38b2a0',Anleihen:'#6c8ebf',Lebensversicherung:'#e0a030',Gold:'#d4b13a',Tagesgeld:'#8fb8de',Bargeld:'#a0a8b2',Krypto:'#c8453b',Hypothek:'#7a3b3b',Sonstiges:'#999'};
const OW=['Alle','Sascha','Janina','Gemeinsam'],LQ=['sofort','mittel','gebunden'];
const RISK=['Aktien','ETFs','Immobilien','Krypto','Gold'];
const defAnn=()=>({infl:.02,years:30,spar:0,rs:.05,auf:0,ret:{Immobilien:.04,Aktien:.07,ETFs:.06,Anleihen:.03,Lebensversicherung:.035,Gold:.03,Tagesgeld:.015,Bargeld:0,Krypto:.1,Sonstiges:.02}});
const VORSICHT={Immobilien:3.5,Aktien:6,ETFs:6,Anleihen:3.5,Lebensversicherung:3,Gold:2.5,Tagesgeld:1.5,Bargeld:0,Krypto:5,Sonstiges:2};
const STR={'Aktiencrash':{Aktien:-.35,ETFs:-.30,Krypto:-.6,Gold:.1},'Immobilien −20 %':{Immobilien:-.2},'Stagflation':{Aktien:-.2,ETFs:-.2,Anleihen:-.1,Immobilien:-.1,Gold:.15},'Große Krise':{Aktien:-.4,ETFs:-.35,Krypto:-.7,Immobilien:-.25,Anleihen:-.05,Gold:.1,Lebensversicherung:-.05}};
const SC=[['Basis',0,'#0f2a43'],['Optimistisch',.02,'#1a9b6c'],['Pessimistisch',-.02,'#c8453b']];
let tab='home',own='Alle',edit=null,cred=null,dz=0,zsub='sz',stn='Aktiencrash';
const f=n=>new Intl.NumberFormat('de-DE',{maximumFractionDigits:0}).format(n)+' €';
const pc=n=>(n*100).toFixed(1).replace('.',',')+' %';
const P=()=>S.pos.filter(p=>own=='Alle'||p.owner==own);
const md=(a,b)=>(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();
const addM=(d,n)=>new Date(d.getFullYear(),d.getMonth()+Math.round(n),1);
const fm=d=>String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
const eur=v=>{const a=Math.abs(v),s=v<0?'−':'';return a<1?'0 €':a>=1e6?s+(a/1e6).toFixed(a>=1e7?0:1).replace('.',',')+' Mio. €':s+Math.round(a/1000)+' Tsd. €'};
function niceStep(range,target){const raw=range/target,e=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/e;return(m<=1?1:m<=2?2:m<=5?5:10)*e}
function sim(R0,z,rateY,max=720){const i=z/1200,p=rateY/12;if(!(R0>0))return{ok:true,n:0,rest:[0],tot:0};
if(!(p>R0*i))return{ok:false,rest:[R0],tot:0};let R=R0,rest=[R0],tot=0;
for(let m=1;m<=max;m++){const it=R*i;tot+=it;R=R+it-p;if(R<=0.5){rest.push(0);return{ok:true,n:m,rest,tot}}rest.push(R)}
return{ok:false,rest,tot}}
function pmtFor(R,z,n){const i=z/1200;if(n<=0)return R*12;return(i==0?R/n:R*i/(1-Math.pow(1+i,-n)))*12}
function ci(p){const has=p.zins!==''&&p.zins!=null&&+p.rate>0;if(!has)return{has:false};
const st=new Date(p.datum),s=sim(+p.wert,+p.zins,+p.rate);const now=new Date();
const mh=Math.max(0,md(st,now));const heute=s.ok?s.rest[Math.min(mh,s.rest.length-1)]:+p.wert;
let mb=null;if(p.bindung){mb=md(st,new Date(p.bindung))}
return{has:true,s,st,mh,heute,mb,frei:s.ok?addM(st,s.n):null,bd:p.bindung?new Date(p.bindung):null}}
function cpath(p,Y,dzA){const z=+p.zins,rate=+p.rate;if(!(p.zins!==''&&rate>0))return Array.from({length:Y+1},()=>+p.wert);
const st=new Date(p.datum),mh=Math.max(0,md(st,new Date())),mb=p.bindung?md(st,new Date(p.bindung)):null;
const total=mh+12*Y;let R=+p.wert;const arr=[R];
for(let m=1;m<=total;m++){const zz=(mb!=null&&m>mb)?z+dzA:z;R=R*(1+zz/1200)-rate/12;if(R<0)R=0;arr.push(R)}
return Array.from({length:Y+1},(_,t)=>arr[mh+12*t])}
function project(mod,list){const A=S.ann,Y=A.years;const act=list.filter(p=>p.typ=='a'),deb=list.filter(p=>p.typ=='p');
const paths=deb.map(p=>cpath(p,Y,A.auf/100));const real=[],nom=[];let pot=0;
for(let t=0;t<=Y;t++){if(t>0)pot=pot*(1+A.rs+mod)+A.spar;
let as=0;act.forEach(p=>{const r=(A.ret[p.klasse]!=null?A.ret[p.klasse]:.02)+(RISK.includes(p.klasse)?mod:0);as+=(+p.wert)*Math.pow(1+r,t)});
let de=0;paths.forEach(a=>de+=a[t]);const n=as+pot-de;nom.push(n);real.push(n/Math.pow(1+A.infl,t))}
return{real,nom}}
function stress(name,list){const sh=STR[name],rows={};let A0=0,A1=0,L=0,liqB=0,liqA=0;
list.forEach(p=>{const w=+p.wert;if(p.typ=='p'){L+=w;return}const s=sh[p.klasse]||0,w2=w*(1+s);A0+=w;A1+=w2;if(p.liq=='sofort'){liqB+=w;liqA+=w2}
rows[p.klasse]=rows[p.klasse]||{b:0,a:0};rows[p.klasse].b+=w;rows[p.klasse].a+=w2});
return{rows,nb:A0-L,na:A1-L,ltvB:A0?L/A0:0,ltvA:A1?L/A1:0,liqB,liqA}}
function kpi(){const a=P().filter(p=>p.typ=='a'),l=P().filter(p=>p.typ=='p');
const A=a.reduce((s,p)=>s+ +p.wert,0),L=l.reduce((s,p)=>s+ +p.wert,0);
const imm=a.filter(p=>p.klasse=='Immobilien').reduce((s,p)=>s+ +p.wert,0);
const liq=a.filter(p=>p.liq=='sofort').reduce((s,p)=>s+ +p.wert,0);
const rate=l.reduce((s,p)=>s+ +(p.rate||0),0);
const old=P().filter(p=>(Date.now()-new Date(p.datum))/864e5>90).length;
return{A,L,N:A-L,ltv:A?L/A:0,imm:A?imm/A:0,liq,rate,old}}
function snap(){const m=new Date().toISOString().slice(0,7);S.hist=S.hist.filter(h=>h.m!=m);S.hist.push({m,N:S.pos.filter(p=>p.typ=='a').reduce((s,p)=>s+ +p.wert,0)-S.pos.filter(p=>p.typ=='p').reduce((s,p)=>s+ +p.wert,0)});save()}
function donut(items){const T=items.reduce((s,i)=>s+i[1],0);if(!T)return'';let a=-Math.PI/2,r=70,c=90,out='';
items.forEach(([n,v])=>{const d=v/T*2*Math.PI,x1=c+r*Math.cos(a),y1=c+r*Math.sin(a),x2=c+r*Math.cos(a+d-.001),y2=c+r*Math.sin(a+d-.001);
out+=`<path d="M${x1} ${y1}A${r} ${r} 0 ${d>Math.PI?1:0} 1 ${x2} ${y2}" stroke="${COL[n]||'#999'}" stroke-width="28" fill="none"/>`;a+=d});
return`<svg viewBox="0 0 180 180" width="190" style="display:block;margin:auto">${out}<text x="90" y="95" text-anchor="middle" font-size="13" fill="#6b7785">Aktiva</text></svg>`}
function spark(){const h=S.hist;if(h.length<2)return'<div class="sub">Verlauf entsteht mit jedem Monats-Update.</div>';
const mx=Math.max(...h.map(x=>x.N)),mn=Math.min(...h.map(x=>x.N)),w=300,hh=70;
const pts=h.map((x,i)=>`${i*w/(h.length-1)},${hh-(x.N-mn)/((mx-mn)||1)*hh}`).join(' ');
return`<svg viewBox="0 0 300 80" width="100%"><polyline points="${pts}" fill="none" stroke="#0f2a43" stroke-width="2.5"/></svg>`}
function bindAmpel(c){if(!c.bd)return{col:'#a0a8b2',txt:'Zinsbindung fehlt'};const mo=md(new Date(),c.bd);
if(mo<0)return{col:'var(--r)',txt:'Zinsbindung abgelaufen'};
return{col:mo<=24?'var(--r)':mo<=60?'var(--o)':'var(--g)',txt:'Zinsbindung bis '+fm(c.bd)+' ('+(mo/12).toFixed(1).replace('.',',')+' J.)'}}
function credCard(){const l=P().filter(p=>p.typ=='p');if(!l.length)return'';
const info=l.map(p=>({p,c:ci(p)}));const ok=info.filter(x=>x.c.has);
const sum=info.reduce((s,x)=>s+(x.c.has?x.c.heute:+x.p.wert),0);
const dates=ok.filter(x=>x.c.bd).sort((a,b)=>a.c.bd-b.c.bd);
const frei=ok.filter(x=>x.c.frei).map(x=>x.c.frei);const last=frei.length==ok.length&&ok.length?new Date(Math.max(...frei)):null;
const miss=info.length-ok.length;const nb=dates[0]?bindAmpel(dates[0].c):null;
return`<div class="card" style="margin-top:12px" onclick="tab='kred';draw()"><h3>Kredite</h3>
<div class="row"><span>Restschuld heute (geschätzt)</span><b>${f(sum)}</b></div>
${nb?`<div class="row"><span><i class="dot" style="background:${nb.col}"></i>Nächste Zinsbindung</span><span>${dates[0].p.name}: ${nb.txt}</span></div>`:''}
${last?`<div class="row"><span>Schuldenfrei (alle Kredite)</span><b>${fm(last)}</b></div>`:''}
${miss?`<div class="sub">${miss} Kredit(e) ohne Zins/Rate – bitte ergänzen.</div>`:''}</div>`}
function home(){if(!S.pos.length)return`<div class="card"><h3>Willkommen</h3><div class="sub">Noch keine Daten. Lege Positionen an oder importiere ein Backup unter „Daten".</div>
<button class="btn" onclick="edit=null;tab='form';draw()">Erste Position anlegen</button><button class="btn s" onclick="tab='dat';draw()">Backup importieren</button></div>`;
const k=kpi();const ampel=(v,g,y)=>v<=g?'var(--g)':v<=y?'var(--o)':'var(--r)';
return`<div class="card"><div class="sub">Nettovermögen · ${own} · ohne Renten/Pensionen</div><div class="big">${f(k.N)}</div>${spark()}</div>
<div class="grid"><div class="k"><span class="sub">Aktiva</span><b>${f(k.A)}</b></div><div class="k"><span class="sub">Passiva</span><b class="neg">${f(k.L)}</b></div>
<div class="k"><span class="sub"><i class="dot" style="background:${ampel(k.ltv,.3,.5)}"></i>Verschuldung</span><b>${pc(k.ltv)}</b></div>
<div class="k"><span class="sub"><i class="dot" style="background:${ampel(k.imm,.4,.6)}"></i>Immobilienanteil</span><b>${pc(k.imm)}</b></div>
<div class="k"><span class="sub">Sofort verfügbar</span><b>${f(k.liq)}</b></div>
<div class="k"><span class="sub">Kreditraten p.a.</span><b>${f(k.rate)}</b></div></div>
${credCard()}
${k.old?`<div class="card"><span class="warn">${k.old} Position(en) älter als 90 Tage</span></div>`:''}
<button class="btn" onclick="edit=null;tab='form';draw()">+ Neue Position</button>
<button class="btn s" onclick="snap();alert('Monatsstand gespeichert')">Monatsstand speichern</button>`}

function chart(c){const r=c.s.rest,n=r.length,mx=r[0]||1,VW=360,VH=190,ML=54,MR=44,MT=14,MB=34,pw=VW-ML-MR,ph=VH-MT-MB;

let g='';[1,.75,.5,.25,0].forEach(l=>{const y=Y(mx*l);
g+=`<line x1="${ML}" x2="${ML+pw}" y1="${y}" y2="${y}" stroke="${l==0?'#1a9b6c':'#e3e7ec'}" stroke-width="${l==0?2:1}"/>
<text x="${ML-5}" y="${y+3}" text-anchor="end" font-size="9" fill="${l==0?'#1a9b6c':'#6b7785'}" ${l==0?'font-weight="700"':''}>${eur(mx*l)}</text>

const step=Math.max(1,Math.floor(n/80));const pts=[];for(let m=0;m<n;m+=step)pts.push(`${X(m)},${Y(r[m])}`);pts.push(`${X(n-1)},${Y(r[n-1])}`);
const area=`${X(0)},${Y(0)} ${pts.join(' ')} ${X(n-1)},${Y(0)}`;
let mk='';
if(c.mh>0&&c.mh<n-1)mk+=`<line x1="${X(c.mh)}" x2="${X(c.mh)}" y1="${MT}" y2="${MT+ph}" stroke="#6b7785" stroke-dasharray="2 3"/><text x="${X(c.mh)}" y="${MT-3}" text-anchor="middle" font-size="9" fill="#6b7785">heute</text>`;
if(c.mb!=null&&c.mb>0&&c.mb<n-1)mk+=`<line x1="${X(c.mb)}" x2="${X(c.mb)}" y1="${MT}" y2="${MT+ph}" stroke="#e0a030" stroke-dasharray="4 3" stroke-width="2"/><text x="${X(c.mb)}" y="${MT+ph+27}" text-anchor="middle" font-size="9" fill="#b9780d">Zinsbindung</text>`;
return`<svg viewBox="0 0 ${VW} ${VH}" width="100%">${g}${xt}<polygon points="${area}" fill="#7a3b3b" opacity=".12"/><polyline points="${pts.join(' ')}" fill="none" stroke="#7a3b3b" stroke-width="2.5"/>${mk}<circle cx="${X(n-1)}" cy="${Y(0)}" r="4" fill="#1a9b6c"/></svg>
<div class="sub">Links: Restschuld in €, 0 € = vollständig getilgt (${fm(c.frei)}). Rechts: Anteil getilgt in % vom Stand am Bewertungsdatum.</div>`}
function kred(){const l=P().filter(p=>p.typ=='p');
if(!l.length)return'<div class="card sub">Keine Kredite erfasst. Lege ein Passivum mit Zins, Rate und Zinsbindung an.</div>';
if(cred){const p=S.pos.find(x=>x.id==cred);if(p)return kdetail(p)}
return l.map(p=>{const c=ci(p);if(!c.has)return`<div class="card" onclick="edit=${p.id};tab='form';draw()"><h3>${p.name}</h3><div class="sub">Sollzins und Rate fehlen. Tippen zum Ergänzen.</div></div>`;
const b=bindAmpel(c);return`<div class="card" onclick="cred=${p.id};dz=0;draw()"><h3>${p.name}</h3>
<div class="row"><span>Restschuld heute (geschätzt)</span><b>${f(c.heute)}</b></div>

function kdetail(p){const c=ci(p);if(!c.has){cred=null;return kred()}
const z=+p.zins,R=+p.rate;let body='';
if(!c.s.ok)body='<div class="warn">Rate deckt die Zinsen nicht – Kredit tilgt nicht.</div>';
else{body=`<div class="grid"><div class="k"><span class="sub">Schuldenfrei</span><b>${fm(c.frei)}</b></div><div class="k"><span class="sub">Restlaufzeit ab Stand</span><b>${(c.s.n/12).toFixed(1).replace('.',',')} J.</b></div>

if(c.mb==null)body+='<div class="card" style="margin-top:12px"><span class="warn">Ende der Zinsbindung fehlt</span></div>';
else if(c.mb>=c.s.n)body+='<div class="card" style="margin-top:12px"><div class="sub">Die Zinsbindung reicht bis zur vollständigen Tilgung – kein Anschlussrisiko.</div></div>';

body+=`<div class="card" style="margin-top:12px"><h3>Anschlussfinanzierung ab ${fm(c.bd)}</h3>

<div class="sub" style="margin-top:10px">Vereinfachung: monatliche Tilgung, Zinsen auf Restschuld, Rate gleichbleibend; Sondertilgungen und Gebühren nicht berücksichtigt.</div>`}
function lineChart(ser,Y){const VW=360,VH=200,ML=56,MR=14,MT=12,MB=26,pw=VW-ML-MR,ph=VH-MT-MB;
const all=ser.flatMap(s=>s.v),mn0=Math.min(0,...all),mx0=Math.max(...all),st=niceStep((mx0-mn0)||1,5);

const X=i=>ML+i/(n-1)*pw,Yy=v=>MT+ph-(v-mn)/((mx-mn)||1)*ph;let g='';
for(let v=mn;v<=mx+st/2;v+=st){const y=Yy(v),z=Math.abs(v)<st/1000;
g+=`<line x1="${ML}" x2="${ML+pw}" y1="${y}" y2="${y}" stroke="${z?'#6b7785':'#e3e7ec'}" stroke-width="${z?1.5:1}"/><text x="${ML-5}" y="${y+3}" text-anchor="end" font-size="9" fill="#6b7785">${eur(v)}</text>`}
const sx=Y>30?10:Y>15?5:Y>8?2:1,y0=new Date().getFullYear();let xt='';
for(let t=0;t<=Y;t+=sx)xt+=`<line x1="${X(t)}" x2="${X(t)}" y1="${MT}" y2="${MT+ph}" stroke="#eef0f3"/><line x1="${X(t)}" x2="${X(t)}" y1="${MT+ph}" y2="${MT+ph+4}" stroke="#6b7785"/><text x="${X(t)}" y="${MT+ph+16}" text-anchor="middle" font-size="9" fill="#6b7785">${y0+t}</text>`;
return`<svg viewBox="0 0 ${VW} ${VH}" width="100%">${g}${xt}${ser.map(s=>`<polyline fill="none" stroke="${s.c}" stroke-width="2.5" points="${s.v.map((v,i)=>X(i)+','+Yy(v)).join(' ')}"/>`).join('')}</svg>
